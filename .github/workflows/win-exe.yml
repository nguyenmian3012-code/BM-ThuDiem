name: win-exe
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish BMThuDiem.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath BM-ThuDiem-1.3.2.zip
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.3.2 --yes --cleanup-tag || true
          gh release create v1.3.2 BM-ThuDiem-1.3.2.zip \
            --title "BM-ThuDiem 1.3.2" \
            --notes "Diem duoi 15 khong vao binh quan va khong gui AutoCan. Admin chon phieu loi roi xoa."
