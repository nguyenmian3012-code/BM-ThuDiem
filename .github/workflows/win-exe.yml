name: win-exe
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish BMThuDiem.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath BM-ThuDiem-1.1.0.zip
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.1.0 --yes --cleanup-tag || true
          gh release create v1.1.0 BM-ThuDiem-1.1.0.zip \
            --title "BM-ThuDiem 1.1.0" \
            --notes "Bieu do COM4, cat doan dung yen 45 giay. Phieu gui qua LocalAppData de AutoCan doc duoc."
